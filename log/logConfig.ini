# 这是一个示例日志配置文件  
# 注释行以#开头，会被忽略  
  
# 日志文件路径   
#logDirPath=D:\VScode\new1\test\log
logDirPath=/home/zdy/MyDir/CPPprojects/test/log/myLog
#fileName=log1  
  
# 文件日志输出级别    
fileLogLevel=3
  
# 终端日志级别   -1 不进行 终端输出
terminalLogLevel=-1
   
# 日志文件最大大小（单位MB）  
maxFileSizeMB=1
  
# 日志文件保留的最大个数
maxLogFiles=5 